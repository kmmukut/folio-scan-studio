name: Feature request
description: Suggest an improvement to Folio.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and who runs into it, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
  - type: checkboxes
    id: fit
    attributes:
      label: Fit with Folio
      options:
        - label: This works on modest hardware (a Raspberry Pi) and doesn't need an external service.
