services:
  scan-studio:
    build: .
    image: folio-scan-studio:0.10.0
    container_name: scan-studio
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "8870:8870"
    environment:
      DATA_DIR: /data
      # Scanners are added in Folio > Devices; nothing scanner-specific belongs here.
      FOLIO_AIRSCAN_DISCOVERY: "${FOLIO_AIRSCAN_DISCOVERY:-off}"  # "on" to also find eSCL/WSD scanners by multicast
      SCAN_TIMEOUT_SECONDS: "900"
      SCAN_GRACE_SECONDS: "30"
      SCAN_STUDIO_ADMIN_USER: "${SCAN_STUDIO_ADMIN_USER:-admin}"
      SCAN_STUDIO_ADMIN_PASSWORD: "${SCAN_STUDIO_ADMIN_PASSWORD:?Set a strong admin password in .env or Portainer variables}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"  # true when served over HTTPS (e.g. behind a reverse proxy)
      # Reverse proxies whose X-Forwarded-For header Folio trusts: comma-separated
      # IPs or networks, e.g. 172.19.0.0/16. Without this, every visitor behind a
      # proxy shares one address for sign-in and guest-print rate limits.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      # One or more CUPS servers, e.g. cups:631 or 192.168.1.10:631,192.168.1.11:631
      CUPS_SERVERS: "${CUPS_SERVERS:-}"
      USER_PRINT_MAX_MB: "${USER_PRINT_MAX_MB:-256}"
      # Full-resolution page decodes allowed at once (default: 2, or 1 on single-core hosts)
      FOLIO_RENDER_CONCURRENCY: "${FOLIO_RENDER_CONCURRENCY:-}"
    volumes:
      - ./data:/data
