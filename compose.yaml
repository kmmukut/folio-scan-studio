# Folio Scan Studio
#   cp .env.example .env    # optional: adjust settings (TZ, edition…)
#   docker compose up -d    # open http://<this-host>:8870 and create the administrator
# Every setting is explained in .env.example and docs/CONFIGURATION.md.
# To build the image from this source instead of pulling it:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  scan-studio:
    # FOLIO_EDITION: "full" (default) or "lite" for Raspberry Pi-class hosts.
    # FOLIO_VERSION: "0.19" follows 0.19.x fixes; pin e.g. "0.19.0" to stay put.
    image: "ghcr.io/kmmukut/folio-scan-studio:${FOLIO_VERSION:-0.19}-${FOLIO_EDITION:-full}"
    container_name: scan-studio
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${FOLIO_PORT:-8870}:8870"
      # The built-in print server, for phones and computers that print to it
      # directly (AirPrint, IPP). Not needed when only Folio prints.
      # - "631:631"
    environment:
      DATA_DIR: /data
      SCAN_STUDIO_ADMIN_USER: "${SCAN_STUDIO_ADMIN_USER:-admin}"
      SCAN_STUDIO_ADMIN_PASSWORD: "${SCAN_STUDIO_ADMIN_PASSWORD:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      FOLIO_BUILTIN_CUPS: "${FOLIO_BUILTIN_CUPS:-on}"
      FOLIO_AIRPRINT_PORT: "${FOLIO_AIRPRINT_PORT:-631}"
      CUPS_SERVERS: "${CUPS_SERVERS:-}"
      USER_PRINT_MAX_MB: "${USER_PRINT_MAX_MB:-256}"
      FOLIO_AIRSCAN_DISCOVERY: "${FOLIO_AIRSCAN_DISCOVERY:-off}"
      FOLIO_RENDER_CONCURRENCY: "${FOLIO_RENDER_CONCURRENCY:-}"
      SCAN_TIMEOUT_SECONDS: "${SCAN_TIMEOUT_SECONDS:-900}"
      SCAN_GRACE_SECONDS: "${SCAN_GRACE_SECONDS:-30}"
    volumes:
      - ./data:/data
      # Announce the built-in printers to phones and computers (AirPrint) through
      # the host's Avahi, which Raspberry Pi OS and most Linux desktops run:
      # - /etc/avahi/services:/etc/avahi/services
      # Folders documents can be sent to (Devices → Destinations), e.g. a NAS
      # share mounted on the host, or Paperless-ngx's consume folder:
      # - /srv/scans:/destinations/nas
    # USB printers and scanners:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
